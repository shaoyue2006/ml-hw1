# Fixed starting configurations, not parameters selected on the test set.
seed = 42
n_splits = 5
threads = 4

[models.ridge]
alpha = 1.0
solver = "lsqr"
tol = 0.000001

[models.poisson]
alpha = 0.1
max_iter = 2000
tol = 0.000001

[models.decision_tree]
criterion = "squared_error"
max_depth = 12
min_samples_leaf = 10

[models.gradient_boosting]
loss = "squared_error"
learning_rate = 0.05
max_iter = 200
max_leaf_nodes = 31
max_depth = 6
min_samples_leaf = 20
l2_regularization = 1.0
early_stopping = false
