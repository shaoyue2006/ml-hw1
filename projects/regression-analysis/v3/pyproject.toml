[project]
name = "bike-sharing-mlp"
version = "0.1.0"
description = "Time-validated PyTorch MLP extension for the Bike Sharing Dataset"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.11.0+cu128", "numpy==2.2.5", "pandas==2.3.3", "scikit-learn==1.7.1",
    "scipy==1.15.3", "joblib==1.5.3", "matplotlib==3.10.8", "tomli==2.4.0",
    "threadpoolctl==3.5.0",
]

[dependency-groups]
dev = ["pytest==9.0.3"]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
extend-select = ["E402"]
