[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "bike-sharing-regression"
version = "0.1.0"
description = "Reproducible regression experiments on UCI Bike Sharing data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "threadpoolctl>=3.8.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
bike-prepare = "bike_sharing.prepare_data:main"
bike-eda = "bike_sharing.extended_analysis:main"
bike-train = "bike_sharing.train:main"
bike-ridge = "bike_sharing.models.ridge:main"
bike-poisson = "bike_sharing.models.poisson:main"
bike-decision-tree = "bike_sharing.models.decision_tree:main"
bike-gradient-boosting = "bike_sharing.models.gradient_boosting:main"
bike-compare = "bike_sharing.aggregate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bike_sharing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
